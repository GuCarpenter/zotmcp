name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint and formatting
        run: npm run lint:check

      # `npm test` is typecheck plus the unit suite. The suite runs in plain Node
      # against a fake Zotero gateway, so it needs no Zotero and no display.
      - name: Typecheck and unit tests
        run: npm test

      # Packaging catches what neither lint nor tests can: a missing asset, a
      # broken manifest substitution, or an esbuild failure.
      - name: Build the XPI
        run: npm run build

      - name: Upload the XPI
        uses: actions/upload-artifact@v4
        with:
          name: zotmcp-xpi
          path: .scaffold/build/zotmcp.xpi
          if-no-files-found: error
