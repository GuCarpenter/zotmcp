name: Release

# Triggered by the tag that `npm run release` pushes. That command behaves
# differently by environment: run locally it bumps the version, commits, tags and
# pushes; run in CI it skips all of that and instead publishes the built assets —
# a release tagged `v<version>` carrying the XPI, plus a release tagged `release`
# carrying `update.json`, which is the URL the plugin's auto-update points at.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish the XPI and update manifest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is generated from commit history, which a shallow
          # checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build the XPI
        run: npm run build

      # No test gate here on purpose: CI already runs the suite on every push to
      # main, which is where a failure should be caught. A tag that has been cut
      # should be publishable without a second opinion.
      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --yes

      # The Firefox clipper is a plain unpacked extension. Sign it through
      # Mozilla's AMO API (self-distribution / unlisted channel) so the produced
      # .xpi installs in normal Firefox, then attach it to the same release that
      # `npm run release` just created for this tag. When AMO credentials are not
      # configured, fall back to an unsigned zip so the release still carries the
      # extension source.
      - name: Package the Firefox clipper
        id: clipper
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          ARTIFACT: zotmcp-clipper-${{ github.ref_name }}.xpi
        run: |
          set -uo pipefail
          # AMO rejects re-submitting a version it has already seen, so the
          # clipper's manifest version must be unique per release. Derive it from
          # the release tag (v1.2.3 -> 1.2.3) rather than a static manifest value.
          VERSION="${GITHUB_REF_NAME#v}"
          tmp="$(mktemp)"
          jq --arg v "$VERSION" '.version = $v' firefox-clipper/manifest.json > "$tmp" \
            && mv "$tmp" firefox-clipper/manifest.json
          echo "Clipper version set to $VERSION"

          pack_unsigned() {
            rm -f "$ARTIFACT"
            (cd firefox-clipper && zip -r -FS "../$ARTIFACT" . -x "*.DS_Store")
          }
          sign() {
            npx --yes web-ext sign \
              --source-dir firefox-clipper \
              --channel unlisted \
              --api-key "$WEB_EXT_API_KEY" \
              --api-secret "$WEB_EXT_API_SECRET" \
              --timeout 900000 \
              --artifacts-dir web-ext-artifacts
          }

          if [ -z "${WEB_EXT_API_KEY:-}" ] || [ -z "${WEB_EXT_API_SECRET:-}" ]; then
            echo "AMO credentials not set; packaging an unsigned .xpi."
            pack_unsigned
          elif sign || sign; then
            # AMO's approval polling is occasionally flaky (503); one retry, then
            # fall back so a transient outage never blocks the release.
            cp "$(ls web-ext-artifacts/*.xpi | head -n1)" "$ARTIFACT"
          else
            echo "::warning::AMO signing failed; attaching an unsigned .xpi."
            pack_unsigned
          fi
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Attach the clipper to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.clipper.outputs.artifact }}" --clobber
