<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .url {
        color: #666;
        word-break: break-all;
        margin-bottom: 10px;
        max-height: 3.6em;
        overflow: hidden;
      }
      label {
        display: block;
        margin: 8px 0 4px;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
      }
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        padding: 7px 12px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        white-space: pre-wrap;
      }
      .ok {
        color: #157a3f;
      }
      .err {
        color: #b22222;
      }
      .muted {
        color: #888;
      }
      details {
        margin-top: 8px;
      }
      summary {
        cursor: pointer;
        color: #666;
      }
    </style>
  </head>
  <body>
    <h1>Save to Zotero</h1>
    <div class="url" id="pageUrl">…</div>

    <details id="opts">
      <summary>Options</summary>
      <label for="collection">Collection</label>
      <select id="collection">
        <option value="">— None (My Library) —</option>
      </select>
      <label class="row">
        <input type="checkbox" id="embed" checked />
        Embed images for offline reading
      </label>
      <label for="endpoint">Endpoint</label>
      <input type="text" id="endpoint" autocomplete="off" />
    </details>

    <div class="row">
      <button id="save">Save page</button>
      <span id="status" class="muted">Zotero must be running.</span>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
